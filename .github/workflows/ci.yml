name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start PostgreSQL
        working-directory: docker
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: analytics
        run: |
          docker compose up -d postgres || {
            docker compose logs postgres
            exit 1
          }

          sleep 5

          if ! docker compose ps postgres | grep -q "Up"; then
            docker compose logs postgres
            exit 1
          fi

      - name: Check PostgreSQL
        working-directory: docker
        run: docker compose ps postgres

      - name: Prepare test data
        working-directory: docker
        env:
          POSTGRES_USER: airflow
          PGPASSWORD: airflow
          AIRFLOW_UID: 50000
        run: |
          docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d analytics \
            < postgres/ci-init.sql

      - name: Debug dbt
        working-directory: docker
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: analytics
          AIRFLOW_UID: 50000
        run: docker compose run --rm --entrypoint dbt dbt debug --profiles-dir .

      - name: Run dbt
        working-directory: docker
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: analytics
          AIRFLOW_UID: 50000
        run: docker compose run --rm --entrypoint dbt dbt run --profiles-dir .
        
      - name: Test dbt
        working-directory: docker
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: analytics
          AIRFLOW_UID: 50000
        run: docker compose run --rm --entrypoint dbt dbt test --profiles-dir .